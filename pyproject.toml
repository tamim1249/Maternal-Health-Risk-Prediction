[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "och-mrnet"
version = "1.0.0"
description = "Leakage-free, safety-first and uncertainty-aware maternal and fetal risk prediction (OCH-MRNet)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "xgboost", "lightgbm", "catboost", "torch", "shap", "matplotlib", "seaborn", "jinja2"]

[tool.setuptools.packages.find]
where = ["src"]
